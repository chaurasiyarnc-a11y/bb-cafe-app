name: Build Windows EXE

on:
  workflow_dispatch: # इससे आप जब चाहें बटन दबाकर .exe बना सकेंगे
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js & Electron EXE
        run: npm run electron:build

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BumBumCafe-Windows-EXE
          path: dist/*.exe
