name: Build Android APK (Cloud Compile)

on:
  push:
    branches:
      - android-app  # हमारी इस नई एंड्रॉइड ब्रांच के लिए
  workflow_dispatch: # कभी भी मैन्युअल रूप से रन करने के लिए

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Next.js Static Web Files
        run: npm run build
        env:
          STATIC_EXPORT: 'true' # केवल मोबाइल APK के लिए एक्सपोर्ट ऑन करता है

      - name: Setup Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BumBumCafePOS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
